name: Build Wazen ERPNext Image

on:
  push:
    branches:
      - version-16
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Wazen
        uses: actions/checkout@v4

      - name: Checkout Frappe Docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          path: frappe_docker

      - name: Create apps.json
        run: |
          cat > frappe_docker/apps.json <<'JSON'
          [
            {
              "url": "https://github.com/frappe/erpnext",
              "branch": "version-16"
            },
            {
              "url": "https://github.com/YahyaAhmed20/wazen-business-management",
              "branch": "version-16"
            }
          ]
          JSON

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frappe_docker
          file: frappe_docker/images/layered/Containerfile
          push: true
          tags: ghcr.io/yahyaahmed20/wazen-business-management:latest
          build-args: |
            FRAPPE_BRANCH=version-16
          secrets: |
            apps_json=frappe_docker/apps.json
